title: Scheduled Task Creation via schtasks
id: "84a8132b-0c26-4069-8068-9cd0779b4e78"
status: experimental
description: Detects schtasks.exe creating a task.
author: lead
date: 2026/10/24
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  condition: selection
falsepositives:
  - Administrators creating tasks
level: high
tags:
  - attack.persistence
  - attack.t1053.005
