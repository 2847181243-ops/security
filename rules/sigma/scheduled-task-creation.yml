title: Scheduled Task Creation via schtasks
id: 6f1c2a9e-lab-0008
status: experimental
description: Detects schtasks.exe creating a task.
author: lead
date: 2026/10/24
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  condition: selection
falsepositives:
  - Administrators creating tasks
level: high
tags:
  - attack.persistence
  - attack.t1053.005
