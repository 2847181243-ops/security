title: Credential Dump via comsvcs MiniDump
id: "1c5ede7a-de5c-4e1c-b020-bf89fed950bd"
status: experimental
description: Detects rundll32 calling comsvcs.dll MiniDump to dump a process.
author: lead
date: 2026/10/24
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\\rundll32.exe'
    CommandLine|contains:
      - 'comsvcs.dll'
      - 'MiniDump'
  condition: selection
falsepositives:
  - Admin diagnostics
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
