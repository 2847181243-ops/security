rules:
  - id: lab-reflected-xss
    languages: [javascript, typescript]
    mode: taint
    message: User input flows into response; possible reflected XSS
    severity: WARNING
    metadata:
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern: $REQ.searchParams.get(...)
    pattern-sinks:
      - pattern: $RES.end(...)
  - id: lab-path-traversal
    languages: [javascript, typescript]
    mode: taint
    message: User input flows into file path; possible path traversal
    severity: ERROR
    metadata:
      category: security
      confidence: MEDIUM
    pattern-sources:
      - pattern: $REQ.searchParams.get(...)
    pattern-sinks:
      - pattern: fs.readFileSync(...)
